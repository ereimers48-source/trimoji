<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Checkout canceled — Trimoji</title>
<link rel="canonical" href="https://trimojiapparel.com/cancel.html">
<meta property="og:url" content="https://trimojiapparel.com/cancel.html">
<style>
:root{--ink:#1d1d1f;--muted:#6e6e73;--accent:#0071e3}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,system-ui,sans-serif;color:var(--ink);background:#fff}
#testmode{background:#f5f5f7;color:var(--ink);text-align:center;font-size:.8rem;padding:8px 16px}
main{max-width:560px;margin:12vh auto;padding:24px;text-align:center}
h1{font-size:2.6rem;font-weight:600;letter-spacing:-.04em;line-height:1.1;margin:0 0 12px}
p{color:var(--muted);font-size:1.15rem;line-height:1.45}
a{display:inline-block;margin-top:22px;background:var(--accent);color:#fff;text-decoration:none;font-weight:500;border-radius:980px;padding:12px 22px;min-height:44px}
.logo{font-weight:600;letter-spacing:-.03em}
</style>
</head>
<body>
<div id="testmode" hidden>Test mode</div>
<main>
<p class="logo">Trimoji</p>
<h1>No charge.</h1>
<p>Checkout was canceled. Your design is still on the page if you want to try again.</p>
<a href="/#shop">Back to the shop</a>
</main>
<script>
fetch('/api/config',{headers:{accept:'application/json'}}).then(r=>r.ok?r.json():null).then(d=>{
  if(d&&d.stripeTestMode===true){var el=document.getElementById('testmode');if(el)el.hidden=false}
}).catch(function(){});
</script>
</body>
</html>
